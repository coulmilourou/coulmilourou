<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-label="Atelier Proxmox : serveur dédié Proxmox VE, double NAT iptables puis OPNsense, deux LAN cloisonnés, DHCP Kea et accès distant par VPN WireGuard">
<style>
.t{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,"DejaVu Sans Mono",monospace}
.nl{font-size:12.5px;font-weight:700;fill:#e6edf3}.ns{font-size:10.5px;fill:#8b949e}.ip{font-size:10.5px}
.dash{stroke-dasharray:6 6;animation:fl 1.1s linear infinite}@keyframes fl{to{stroke-dashoffset:-24}}
.blk{animation:bk 1.6s ease-in-out infinite}@keyframes bk{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dash,.blk{animation:none}}
</style>
<rect x="1" y="1" width="898" height="558" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
<text x="26" y="36" class="t" font-size="15" font-weight="700" fill="#e6edf3">Atelier Proxmox · serveur dédié, pare-feu et VPN</text>
<text x="26" y="55" class="m ns">Proxmox VE · bridges Linux · NAT iptables · OPNsense · Kea DHCPv4 · WireGuard · cloisonnement de LAN</text>
<rect x="200" y="72" width="676" height="400" rx="12" fill="#161b22" stroke="#E57000" stroke-opacity=".6" stroke-dasharray="5 4"/>
<text x="216" y="94" class="t nl" fill="#E57000" style="fill:#E57000">Hôte Proxmox VE</text><text x="340" y="94" class="m ns">serveur dédié · une seule IP publique</text>
<g><path d="M60 140 a26 26 0 0 1 48 -10 a20 20 0 0 1 34 14 a18 18 0 0 1 -6 34 h-74 a20 20 0 0 1 -2 -38z" fill="#161b22" stroke="#8b949e" stroke-width="1.4"/><text x="98" y="166" text-anchor="middle" class="t nl">Internet</text></g>
<rect x="40" y="330" width="120" height="70" rx="8" fill="#0d1117" stroke="#bc8cff" stroke-width="1.6"/>
<rect x="78" y="400" width="44" height="6" rx="2" fill="#bc8cff" opacity=".6"/>
<text x="100" y="356" text-anchor="middle" class="t nl">PC admin</text><text x="100" y="372" text-anchor="middle" class="m ns">client WireGuard</text><text x="100" y="388" text-anchor="middle" class="m ip" fill="#bc8cff">10.42.0.2/32</text>
<rect x="230" y="112" width="250" height="92" rx="8" fill="#0d1117" stroke="#E57000" stroke-width="1.6"/>
<rect x="230" y="112" width="5" height="92" rx="2.5" fill="#E57000"/>
<text x="246" y="134" class="t nl">NAT Proxmox · iptables</text>
<text x="246" y="150" class="m ns">vmbr0 → sortie Internet</text>
<text x="246" y="168" class="m ip" fill="#f0883e">ip_forward=1 · MASQUERADE</text>
<text x="246" y="183" class="m ip" fill="#bc8cff">DNAT udp/51820 → OPNsense</text>
<rect x="560" y="112" width="290" height="92" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="1.6"/>
<rect x="560" y="112" width="5" height="92" rx="2.5" fill="#f85149"/>
<text x="576" y="134" class="t nl">VM OPNsense</text>
<text x="576" y="150" class="m ns">routeur · pare-feu · NAT</text>
<text x="576" y="168" class="m ip" fill="#e6edf3">WAN 192.168.42.254/24 · vmbr1</text>
<text x="576" y="183" class="m ip" fill="#bc8cff">wg0 10.42.0.1/24 · port 51820</text>
<rect x="260" y="330" width="270" height="120" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="1.6"/>
<rect x="260" y="330" width="5" height="120" rx="2.5" fill="#3fb950"/>
<text x="276" y="352" class="t nl">LAN1 · vmbr2</text>
<text x="276" y="368" class="m ns">10.0.0.0/16 · passerelle .1</text>
<text x="276" y="386" class="m ip" fill="#3fb950">Kea DHCP 10.0.0.50 → .250</text>
<text x="276" y="401" class="m ip" fill="#e6edf3">VM Windows 11</text>
<text x="276" y="416" class="m ip" fill="#8b949e">règle LAN → any</text>
<rect x="580" y="330" width="270" height="120" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="1.6"/>
<rect x="580" y="330" width="5" height="120" rx="2.5" fill="#58a6ff"/>
<text x="596" y="352" class="t nl">LAN2 · vmbr3</text>
<text x="596" y="368" class="m ns">172.16.0.0/16 · passerelle .1</text>
<text x="596" y="386" class="m ip" fill="#58a6ff">Kea DHCP 172.16.0.50 → .250</text>
<text x="596" y="401" class="m ip" fill="#e6edf3">VM du binôme</text>
<text x="596" y="416" class="m ip" fill="#8b949e">règle LAN2 → any</text>
<path d="M142 156 L230 156" stroke="#8b949e" stroke-width="2"/>
<path d="M480 156 L560 156" stroke="#E57000" stroke-width="2"/><text x="520" y="148" text-anchor="middle" class="m ns">vmbr1</text>
<path d="M640 204 L640 260 L395 260 L395 330" stroke="#3fb950" stroke-width="2" fill="none"/>
<path d="M760 204 L760 260 L715 260 L715 330" stroke="#58a6ff" stroke-width="2" fill="none"/>
<g class="blk"><line x1="555" y1="335" x2="555" y2="445" stroke="#f85149" stroke-width="3" stroke-dasharray="4 4"/><circle cx="555" cy="390" r="12" fill="#0d1117" stroke="#f85149" stroke-width="2"/><path d="M549 384 l12 12 M561 384 l-12 12" stroke="#f85149" stroke-width="2.2" stroke-linecap="round"/></g>
<text x="555" y="465" text-anchor="middle" class="m ns" fill="#f85149" style="fill:#f85149">trafic LAN1 ↔ LAN2 bloqué</text>
<path d="M160 350 C185 300 185 232 225 226 L545 226 C565 226 578 218 582 204" stroke="#bc8cff" stroke-width="2.5" fill="none" class="dash"/>
<text x="300" y="242" class="m ip" fill="#bc8cff">tunnel WireGuard · UDP 51820 · split tunnel</text>
<circle r="4.5" fill="#bc8cff"><animateMotion dur="2.6s" begin="0s" repeatCount="indefinite" path="M160 350 C185 300 185 232 225 226 L545 226 C565 226 578 218 582 204"/><animate attributeName="opacity" values="0;1;1;0" dur="2.6s" begin="0s" repeatCount="indefinite"/></circle>
<circle r="4.5" fill="#8b949e"><animateMotion dur="1.4s" begin="0.3s" repeatCount="indefinite" path="M142 156 L230 156"/><animate attributeName="opacity" values="0;1;1;0" dur="1.4s" begin="0.3s" repeatCount="indefinite"/></circle>
<circle r="4.5" fill="#E57000"><animateMotion dur="1.4s" begin="0.7s" repeatCount="indefinite" path="M480 156 L560 156"/><animate attributeName="opacity" values="0;1;1;0" dur="1.4s" begin="0.7s" repeatCount="indefinite"/></circle>
<circle r="4.5" fill="#3fb950"><animateMotion dur="2.2s" begin="0s" repeatCount="indefinite" path="M395 330 L395 260 L640 260 L640 204"/><animate attributeName="opacity" values="0;1;1;0" dur="2.2s" begin="0s" repeatCount="indefinite"/></circle>
<circle r="4.5" fill="#58a6ff"><animateMotion dur="2.0s" begin="0.9s" repeatCount="indefinite" path="M715 330 L715 260 L760 260 L760 204"/><animate attributeName="opacity" values="0;1;1;0" dur="2.0s" begin="0.9s" repeatCount="indefinite"/></circle>

<line x1="26" y1="490" x2="874" y2="490" stroke="#30363d"/>
<text x="26" y="512" class="m" font-size="11.5" fill="#8b949e"><tspan fill="#3fb950">✔</tspan> double NAT (iptables puis OPNsense) · règles persistées au démarrage   <tspan fill="#3fb950">✔</tspan> WAN/LAN identifiés par adresse MAC</text>
<text x="26" y="532" class="m" font-size="11.5" fill="#8b949e"><tspan fill="#3fb950">✔</tspan> VPN WireGuard en split tunnel · règles WAN et tunnel   <tspan fill="#3fb950">✔</tspan> diagnostic avec tcpdump et compteurs iptables</text>
</svg>